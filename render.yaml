# Render blueprint — persistent, production-hardened deploy.
# In Render: New → Blueprint → connect this repo. It provisions a managed
# PostgreSQL database and the web service (API + UI on one HTTPS origin).
#
# Data persists across redeploys (Postgres, not the old ephemeral SQLite).
# SECRET_KEY is generated; ENVIRONMENT=production turns on the fail-fast guards
# (a strong secret, a non-'*' CORS origin, and a non-SQLite DB are all required).
# If you rename the service, update CORS_ORIGINS to its public URL.
databases:
  - name: creator-hub-db
    plan: free
    databaseName: creatorhub
    user: creatorhub

services:
  - type: web
    name: creator-hub
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: creator-hub-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://creator-hub.onrender.com
      - key: WEB_CONCURRENCY
        value: "2"
