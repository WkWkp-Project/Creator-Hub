<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Creator Hub — Influencer Database</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500;1,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="./assets/styles.css?v=7" />
<script>
  tailwind.config = {
    darkMode: "class",
    theme: { extend: {
      colors: {
        "on-tertiary":"#ffffff","surface-container":"#e7eefe","on-error-container":"#93000a",
        "primary-fixed-dim":"#adc6ff","secondary":"#006c49","on-surface":"#151c27",
        "surface-container-highest":"#dce2f3","primary-fixed":"#d8e2ff","on-error":"#ffffff",
        "error":"#ba1a1a","surface-bright":"#f9f9ff","surface":"#f9f9ff","background":"#f9f9ff",
        "on-secondary":"#ffffff","surface-dim":"#d3daea","surface-container-high":"#e2e8f8",
        "surface-container-lowest":"#ffffff","surface-tint":"#005ac2","on-primary":"#ffffff",
        "primary":"#0058be","primary-container":"#2170e4","on-surface-variant":"#424754",
        "inverse-surface":"#2a313d","surface-container-low":"#f0f3ff","error-container":"#ffdad6",
        "secondary-container":"#6cf8bb","inverse-on-surface":"#ebf1ff","primary-fixed-dim":"#adc6ff",
        "surface-variant":"#dce2f3","on-primary-container":"#fefcff","outline":"#727785",
        "inverse-primary":"#adc6ff","outline-variant":"#c2c6d6","on-background":"#151c27",
        "on-secondary-container":"#00714d","tertiary":"#b90538","primary-fixed":"#d8e2ff"
      },
      borderRadius:{ DEFAULT:"0.25rem", lg:"0.5rem", xl:"0.75rem", "2xl":"1rem", full:"9999px" },
      spacing:{ "container-max":"1440px","3xl":"64px","xs":"4px","base":"4px","md":"16px",
        "2xl":"48px","sm":"8px","xl":"32px","gutter":"24px","lg":"24px" },
      fontFamily:{
        sans:["Prompt","Poppins","sans-serif"],
        poppins:["Poppins","Prompt","sans-serif"]
      }
    }}
  }
</script>
</head>
<body class="bg-background text-on-surface antialiased flex min-h-screen font-sans">

  <!-- ============ Side Navigation ============ -->
  <aside class="fixed left-0 top-0 bottom-0 w-[280px] flex flex-col p-md z-40 bg-surface-container-lowest border-r border-outline-variant shadow-sm">
    <div class="flex items-center gap-sm mb-xl px-sm">
      <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center shrink-0">
        <span class="material-symbols-outlined text-on-primary text-[22px]">hub</span>
      </div>
      <div class="flex flex-col">
        <span class="text-[24px] leading-8 font-black text-primary font-poppins">Creator Hub</span>
        <span class="text-[12px] tracking-wider font-semibold text-on-surface-variant">Enterprise Management</span>
      </div>
    </div>

    <div class="flex flex-col gap-sm mb-xl">
      <button data-action="add-influencer" data-admin-only class="w-full bg-primary text-on-primary text-[15px] font-semibold rounded-lg py-sm px-md hover:bg-primary-container transition-colors shadow-sm flex items-center justify-center gap-sm">
        <span class="material-symbols-outlined text-[20px]">add</span> Add Influencer
      </button>
      <button data-action="import" data-admin-only class="w-full bg-surface text-primary border border-primary text-[15px] font-semibold rounded-lg py-sm px-md hover:bg-surface-container-low transition-colors shadow-sm flex items-center justify-center gap-sm">
        <span class="material-symbols-outlined text-[20px]">upload_file</span> Import Data
      </button>
      <button data-action="export" class="w-full bg-surface text-on-surface-variant border border-outline-variant text-[15px] font-semibold rounded-lg py-sm px-md hover:bg-surface-container-low transition-colors flex items-center justify-center gap-sm">
        <span class="material-symbols-outlined text-[20px]">download</span> Export Excel
      </button>
    </div>

    <nav class="flex-1 flex flex-col gap-sm" id="sidenav">
      <a data-route="#/assets" class="nav-link flex items-center gap-md px-md py-sm rounded-lg font-semibold transition-all">
        <span class="material-symbols-outlined">hexagon</span> Campaigns
      </a>
      <a data-route="#/members" class="nav-link flex items-center gap-md px-md py-sm rounded-lg font-semibold transition-all">
        <span class="material-symbols-outlined">groups</span> Members
      </a>
      <a data-route="#/directory" class="nav-link flex items-center gap-md px-md py-sm rounded-lg font-semibold transition-all">
        <span class="material-symbols-outlined">person_search</span> Directory
      </a>
      <a data-route="#/analytics" class="nav-link flex items-center gap-md px-md py-sm rounded-lg font-medium transition-all">
        <span class="material-symbols-outlined">monitoring</span> Analytics
      </a>
    </nav>

    <div class="mt-auto pt-md border-t border-outline-variant flex flex-col gap-sm">
      <a data-route="#/settings" class="nav-link flex items-center gap-md px-md py-sm rounded-lg font-medium transition-colors">
        <span class="material-symbols-outlined">settings</span> Settings
      </a>
      <a data-route="#/support" class="nav-link flex items-center gap-md px-md py-sm rounded-lg font-medium transition-colors">
        <span class="material-symbols-outlined">contact_support</span> Support
      </a>
    </div>
  </aside>

  <!-- ============ Main ============ -->
  <main class="ml-[280px] flex-1 flex flex-col min-h-screen">
    <header class="sticky top-0 z-30 flex justify-between items-center w-full px-xl bg-surface/90 backdrop-blur h-16 border-b border-outline-variant">
      <div class="flex items-center gap-md">
        <span class="text-[22px] font-bold text-primary font-poppins">InfluencerFlow</span>
        <div class="ml-lg relative flex items-center w-72">
          <span class="material-symbols-outlined absolute left-sm text-on-surface-variant text-[20px]">search</span>
          <input id="global-search" class="w-full pl-10 pr-sm py-2 bg-surface-container-low border border-outline-variant rounded-lg text-[15px] focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" placeholder="Search influencers..." type="text" />
        </div>
      </div>
      <div class="flex items-center gap-sm">
        <button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors">
          <span class="material-symbols-outlined">notifications</span>
        </button>
        <button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors">
          <span class="material-symbols-outlined">help</span>
        </button>
        <div id="profile-host" class="relative ml-sm"></div>
      </div>
    </header>

    <div id="view" class="p-lg max-w-[container-max] mx-auto w-full flex-1 flex flex-col gap-lg">
      <!-- routed content renders here -->
    </div>
  </main>

  <!-- Modal mount point -->
  <div id="modal-root"></div>

  <script src="./assets/app.js?v=8"></script>
  <script src="./assets/contentasset.js?v=3"></script>
  <script src="./assets/members.js?v=1"></script>
</body>
</html>
