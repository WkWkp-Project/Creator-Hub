<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Creator Hub — Influencer Database</title>
<link rel="icon" href="./favicon.ico?v=2" sizes="any" />
<link rel="icon" type="image/png" href="./favicon.png?v=2" sizes="256x256" />
<link rel="apple-touch-icon" href="./favicon.png?v=2" />
<link rel="stylesheet" href="./assets/tailwind.css?v=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500;1,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha384-PPIZEGYM1v8zp5Py7UjFb79S58UeqCL9pYVnVPURKEqvioPROaVAJKKLzvH2rDnI" crossorigin="anonymous" referrerpolicy="no-referrer" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="./assets/styles.css?v=57" />
<style>
  /* Directory influencer form: campaign spend belongs in Section B, not roster profiles. */
  #inf-form div:has(+ label > input[name="base_rate"]),
  #inf-form label:has(input[name="base_rate"]),
  #inf-form label:has(input[name="code_gen_fee"]),
  #inf-form label:has(input[name="management_fee"]),
  #inf-form label:has(input[name="agency_fee_pct"]),
  #inf-form label:has(select[name="currency"]) {
    display: none !important;
  }
</style>
</head>
<body class="bg-background text-on-surface antialiased flex min-h-screen font-sans">

  <!-- ============ Side Navigation ============ -->
  <aside class="app-sidebar fixed left-0 top-0 bottom-0 w-[280px] flex flex-col p-md z-40">
    <div class="sb-brand">
      <img class="sb-brand-logo" src="./assets/wakuwaku-full.png?v=1" alt="Wakuwaku Production"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"/>
      <div class="flex flex-col" style="display:none">
        <span class="sb-brand-name font-poppins">Wakuwaku</span>
        <span class="sb-brand-sub">Production</span>
      </div>
    </div>

    <div class="sb-divider"></div>

    <section class="sb-section">
      <div class="sb-section-title">Views</div>
      <nav class="flex flex-col gap-sm" id="sidenav">
        <a data-route="#/home" class="nav-link flex items-center gap-md px-md py-sm rounded-lg font-semibold transition-all">
          <span class="material-symbols-outlined">dashboard</span> Dashboard
        </a>
        <a data-route="#/assets" class="nav-link flex items-center gap-md px-md py-sm rounded-lg font-semibold transition-all">
          <span class="material-symbols-outlined">hexagon</span> Campaigns
        </a>
        <a data-route="#/directory" class="nav-link flex items-center gap-md px-md py-sm rounded-lg font-semibold transition-all">
          <span class="material-symbols-outlined">person_search</span> Directory
        </a>
        <a data-route="#/analytics" class="nav-link flex items-center gap-md px-md py-sm rounded-lg font-medium transition-all">
          <span class="material-symbols-outlined">monitoring</span> Analytics
        </a>
      </nav>
    </section>

    <section class="sb-section sb-actions">
      <div class="sb-section-title">Actions</div>
      <div class="sb-tools">
        <button data-action="add-influencer" data-admin-only class="sb-tool-link"><span class="material-symbols-outlined">add</span> Add Influencer</button>
        <button data-action="import" data-admin-only class="sb-tool-link"><span class="material-symbols-outlined">upload_file</span> Import Data</button>
        <button data-action="export" class="sb-tool-link"><span class="material-symbols-outlined">download</span> Export</button>
        <button data-action="backup-json" data-admin-only class="sb-tool-link"><span class="material-symbols-outlined">save</span> Backup .json</button>
        <button data-action="restore-json" data-admin-only class="sb-tool-link"><span class="material-symbols-outlined">restore_page</span> Restore .json</button>
      </div>
    </section>

    <div class="sb-footer mt-auto pt-md flex flex-col gap-sm">
      <a data-route="#/settings" class="nav-link flex items-center gap-md px-md py-sm rounded-lg font-medium transition-colors">
        <span class="material-symbols-outlined">settings</span> Settings
      </a>
      <a data-route="#/support" class="nav-link flex items-center gap-md px-md py-sm rounded-lg font-medium transition-colors">
        <span class="material-symbols-outlined">contact_support</span> Support
      </a>
    </div>
  </aside>

  <!-- ============ Main ============ -->
  <div class="nav-overlay" id="nav-overlay"></div>

  <main class="ml-[280px] flex-1 flex flex-col min-h-screen">
    <header class="sticky top-0 z-30 flex justify-between items-center w-full px-xl bg-surface/90 backdrop-blur h-16 border-b border-outline-variant">
      <div class="flex items-center gap-md">
        <button id="nav-toggle" class="sb-hamburger w-10 h-10 items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-low" title="เมนู" aria-label="เปิดเมนู"><span class="material-symbols-outlined">menu</span></button>
        <img class="top-brand-logo" src="./assets/influ-logo.png?v=1" alt="Influencer" />
        <div class="ml-lg relative flex items-center w-72">
          <span class="material-symbols-outlined absolute left-sm text-on-surface-variant text-[20px]">search</span>
          <input id="global-search" class="w-full pl-10 pr-sm py-2 bg-surface-container-low border border-outline-variant rounded-lg text-[15px] focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" placeholder="Search influencers..." type="text" />
        </div>
      </div>
      <div class="flex items-center gap-sm">
        <button id="ver-history" data-admin-only title="ประวัติเวอร์ชัน — ดู / กดย้อนกลับ (เก็บ 10 เวอร์ชันล่าสุด)" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors">
          <span class="material-symbols-outlined">history</span>
        </button>
        <div id="profile-host" class="relative ml-sm"></div>
      </div>
    </header>

    <div id="view" class="p-lg max-w-[container-max] mx-auto w-full flex-1 flex flex-col gap-lg">
      <!-- routed content renders here -->
    </div>
  </main>

  <!-- Modal mount point -->
  <div id="modal-root"></div>

  <script src="./assets/app.js?v=37"></script>
  <script src="./assets/contentasset.js?v=42"></script>
  <script>
    (() => {
      const brandNameSpan = (row) => Array.from(row.children)
        .find((node) => node.tagName === "SPAN" && node.classList.contains("w-36"));
      const enhanceBrandRows = () => {
        const root = document.querySelector("#br-list");
        if (!root || !window.CH) return;
        root.querySelectorAll("[data-id]").forEach((row) => {
          if (row.dataset.brandEditEnhanced) return;
          const nameSpan = brandNameSpan(row);
          const deleteBtn = row.querySelector("[data-del]");
          if (!nameSpan || !deleteBtn) return;
          row.dataset.brandEditEnhanced = "1";
          const editBtn = document.createElement("button");
          editBtn.type = "button";
          editBtn.className = "text-on-surface-variant hover:text-primary";
          editBtn.title = "แก้ชื่อแบรนด์";
          editBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]">edit</span>';
          deleteBtn.before(editBtn);
          editBtn.addEventListener("click", async () => {
            const id = row.dataset.id;
            const current = nameSpan.textContent.trim();
            const next = prompt("แก้ชื่อแบรนด์", current);
            if (next === null) return;
            const name = next.trim();
            if (!name || name === current) return;
            try {
              await window.CH.api("/brands/" + id, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name }),
              });
              nameSpan.textContent = name;
              nameSpan.title = name;
              window.CH.toast("แก้ชื่อแบรนด์แล้ว");
            } catch (e) {
              window.CH.toast(e.message || "แก้ชื่อแบรนด์ไม่สำเร็จ", "err");
            }
          });
        });
      };
      const start = () => {
        const mount = document.querySelector("#modal-root");
        if (mount) new MutationObserver(enhanceBrandRows).observe(mount, { childList: true, subtree: true });
        enhanceBrandRows();
      };
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
      else start();
    })();
  </script>
  <script src="./assets/ca-section-a.js?v=5"></script>
  <script src="./assets/ca-section-b.js?v=18"></script>
  <script src="./assets/ca-section-c.js?v=12"></script>
  <script src="./assets/ca-section-d.js?v=7"></script>
</body>
</html>
