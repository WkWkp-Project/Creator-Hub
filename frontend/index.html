<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Creator Hub — Influencer Database</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500;1,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="./assets/styles.css?v=41" />
<script>
  tailwind.config = {
    darkMode: "class",
    theme: { extend: {
      colors: {
        // Wakuwaku brand — red / black / white (committed)
        "primary":"#e1121c","primary-container":"#b80f18","on-primary":"#ffffff","on-primary-container":"#ffffff",
        "surface-tint":"#e1121c","tertiary":"#b80f18","on-tertiary":"#ffffff",
        "background":"#f6f6f7","surface":"#ffffff","surface-bright":"#ffffff","surface-dim":"#d8d8db",
        "surface-container-lowest":"#ffffff","surface-container-low":"#f4f4f5","surface-container":"#ededee",
        "surface-container-high":"#e6e6e8","surface-container-highest":"#dededf","surface-variant":"#e9e9ea",
        "on-surface":"#18181b","on-background":"#18181b","on-surface-variant":"#52525b",
        "outline":"#a1a1aa","outline-variant":"#d4d4d8",
        "secondary":"#27272a","on-secondary":"#ffffff","secondary-container":"#e4e4e7","on-secondary-container":"#18181b",
        "error":"#ba1a1a","on-error":"#ffffff","error-container":"#ffdad6","on-error-container":"#410002",
        "inverse-surface":"#2a2a2e","inverse-on-surface":"#f4f4f5","inverse-primary":"#ff8a8f",
        "primary-fixed":"#ffd9da","primary-fixed-dim":"#ffb3b6"
      },
      borderRadius:{ DEFAULT:"0.25rem", lg:"0.5rem", xl:"0.75rem", "2xl":"1rem", full:"9999px" },
      spacing:{ "container-max":"1440px","3xl":"64px","xs":"4px","base":"4px","md":"16px",
        "2xl":"48px","sm":"8px","xl":"32px","gutter":"24px","lg":"24px" },
      fontFamily:{
        sans:["Prompt","Poppins","sans-serif"],
        poppins:["Poppins","Prompt","sans-serif"]
      }
    }}
  }
</script>
</head>
<body class="bg-background text-on-surface antialiased flex min-h-screen font-sans">

  <!-- ============ Side Navigation ============ -->
  <aside class="app-sidebar fixed left-0 top-0 bottom-0 w-[280px] flex flex-col p-md z-40">
    <div class="sb-brand">
      <span class="sb-logo" aria-hidden="true">
        <img class="sb-logo-img" src="./assets/wakuwaku-logo.png?v=2" alt="Wakuwaku"
             onerror="this.style.display='none';this.nextElementSibling.style.display='block';"/>
        <svg class="sb-logo-fallback" style="display:none" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3.5" y="3.5" width="57" height="57" stroke="currentColor" stroke-width="5"/>
          <path d="M15 18 L23 46 L32 27 L41 46 L49 18" stroke="currentColor" stroke-width="6" fill="none"/>
          <rect x="23" y="49.5" width="18" height="4.5" fill="currentColor"/>
        </svg>
      </span>
      <div class="flex flex-col">
        <span class="sb-brand-name font-poppins">Influencer Hub</span>
        <span class="sb-brand-sub">Data</span>
      </div>
    </div>

    <div class="flex flex-col gap-sm mb-xl">
      <button data-action="add-influencer" data-admin-only class="sb-btn sb-btn-primary">
        <span class="material-symbols-outlined text-[20px]">add</span> Add Influencer
      </button>
      <button data-action="import" data-admin-only class="sb-btn sb-btn-outline">
        <span class="material-symbols-outlined text-[20px]">upload_file</span> Import Data
      </button>
      <button data-action="export" class="sb-btn sb-btn-ghost">
        <span class="material-symbols-outlined text-[20px]">download</span> Export Excel
      </button>
    </div>

    <nav class="flex-1 flex flex-col gap-sm" id="sidenav">
      <a data-route="#/home" class="nav-link flex items-center gap-md px-md py-sm rounded-lg font-semibold transition-all">
        <span class="material-symbols-outlined">dashboard</span> Dashboard
      </a>
      <a data-route="#/assets" class="nav-link flex items-center gap-md px-md py-sm rounded-lg font-semibold transition-all">
        <span class="material-symbols-outlined">hexagon</span> Campaigns
      </a>
      <a data-route="#/directory" class="nav-link flex items-center gap-md px-md py-sm rounded-lg font-semibold transition-all">
        <span class="material-symbols-outlined">person_search</span> Directory
      </a>
      <a data-route="#/analytics" class="nav-link flex items-center gap-md px-md py-sm rounded-lg font-medium transition-all">
        <span class="material-symbols-outlined">monitoring</span> Analytics
      </a>
    </nav>

    <div class="sb-footer mt-auto pt-md flex flex-col gap-sm">
      <a data-route="#/settings" class="nav-link flex items-center gap-md px-md py-sm rounded-lg font-medium transition-colors">
        <span class="material-symbols-outlined">settings</span> Settings
      </a>
      <a data-route="#/support" class="nav-link flex items-center gap-md px-md py-sm rounded-lg font-medium transition-colors">
        <span class="material-symbols-outlined">contact_support</span> Support
      </a>
    </div>
  </aside>

  <!-- ============ Main ============ -->
  <div class="nav-overlay" id="nav-overlay"></div>

  <main class="ml-[280px] flex-1 flex flex-col min-h-screen">
    <header class="sticky top-0 z-30 flex justify-between items-center w-full px-xl bg-surface/90 backdrop-blur h-16 border-b border-outline-variant">
      <div class="flex items-center gap-md">
        <button id="nav-toggle" class="sb-hamburger w-10 h-10 items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-low" title="เมนู" aria-label="เปิดเมนู"><span class="material-symbols-outlined">menu</span></button>
        <span class="text-[22px] font-bold text-primary font-poppins">InfluencerFlow</span>
        <div class="ml-lg relative flex items-center w-72">
          <span class="material-symbols-outlined absolute left-sm text-on-surface-variant text-[20px]">search</span>
          <input id="global-search" class="w-full pl-10 pr-sm py-2 bg-surface-container-low border border-outline-variant rounded-lg text-[15px] focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" placeholder="Search influencers..." type="text" />
        </div>
      </div>
      <div class="flex items-center gap-sm">
        <button id="ver-history" data-admin-only title="ประวัติเวอร์ชัน — ดู / กดย้อนกลับ (เก็บ 10 เวอร์ชันล่าสุด)" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors">
          <span class="material-symbols-outlined">history</span>
        </button>
        <div id="profile-host" class="relative ml-sm"></div>
      </div>
    </header>

    <div id="view" class="p-lg max-w-[container-max] mx-auto w-full flex-1 flex flex-col gap-lg">
      <!-- routed content renders here -->
    </div>
  </main>

  <!-- Modal mount point -->
  <div id="modal-root"></div>

  <script src="./assets/app.js?v=27"></script>
  <script src="./assets/contentasset.js?v=36"></script>
  <script src="./assets/ca-section-a.js?v=3"></script>
  <script src="./assets/ca-section-b.js?v=7"></script>
  <script src="./assets/ca-section-c.js?v=9"></script>
  <script src="./assets/ca-section-d.js?v=5"></script>
</body>
</html>
