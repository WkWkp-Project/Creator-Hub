# Plesk reverse proxy → the uvicorn service (127.0.0.1:8020).
# Paste this into:  Plesk → <domain> → Apache & nginx Settings →
#                   "Additional nginx directives".
# Then UNTICK "Proxy mode" and "Smart static files processing" for the domain so
# nginx hands every request to our app (the app serves the frontend + /uploads
# itself). Keep "Let's Encrypt" SSL on.
location / {
    proxy_pass http://127.0.0.1:8020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 12m;   # imports/uploads are capped at 10 MB — leave headroom
}
